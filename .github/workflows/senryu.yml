name: Uwuzu Senryu Bot

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install -r requirements.txt

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: seen.txt
          key: seen-cache

      - name: Run bot
        env:
          UWUZU_DOMAIN: ${{ secrets.UWUZU_DOMAIN }}
          UWUZU_TOKEN: ${{ secrets.UWUZU_TOKEN }}
        run: |
          python bot.py
